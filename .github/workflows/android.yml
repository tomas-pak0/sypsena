name: Android release
on:
  push:
    branches: [main, work/sypsena-1.3.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node test-ui.cjs
      - run: |
          mkdir -p www
          cp index.html translations.js privacy.html manifest.webmanifest service-worker.js www/
          cp -R icons www/
          npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sypsena-1.3.0-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.html
            sypsena-screen.png
